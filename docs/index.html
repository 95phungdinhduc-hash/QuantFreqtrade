<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lil_Duck Quant</title>
  <meta name="description" content="Tín hiệu crypto bằng thống kê: Z-Score, EMA, kiểm định ADF, cắt lỗ/chốt lời theo % rủi ro. Dữ liệu Binance trực tiếp.">
  <meta name="theme-color" content="#05070d">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duck Quant">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="./" aria-label="Lil_Duck Quant — trang chủ">
        <span class="logo"><span>🦆</span></span>
        <span><b>Lil_Duck Quant</b><small>Thống kê × Binance</small></span>
      </a>
      <span class="spacer"></span>
      <span class="status" id="status" aria-live="polite"></span>
      <button class="icon-btn" id="refresh" type="button" aria-label="Làm mới dữ liệu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <main class="app">
    <section class="view on" id="v-home" aria-label="Tổng quan"></section>
    <section class="view" id="v-signals" aria-label="Tín hiệu"></section>
    <section class="view" id="v-chart" aria-label="Biểu đồ"></section>
    <section class="view" id="v-settings" aria-label="Vốn và cài đặt"></section>
  </main>

  <nav class="tabbar" aria-label="Điều hướng">
    <div class="tabs" role="tablist">
      <span class="tab-ind" aria-hidden="true"></span>
      <button class="tab" id="t-home" role="tab" aria-selected="true" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
        <span>Tổng quan</span></button>
      <button class="tab" id="t-signals" role="tab" aria-selected="false" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>
        <span>Tín hiệu</span><span class="badge-n" id="sig-badge" hidden></span></button>
      <button class="tab" id="t-chart" role="tab" aria-selected="false" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg>
        <span>Biểu đồ</span></button>
      <button class="tab" id="t-settings" role="tab" aria-selected="false" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2"/><path d="M3 10h18"/><path d="M7 6V4h10v2"/></svg>
        <span>Vốn</span></button>
    </div>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <noscript><p style="padding:100px 20px;text-align:center">Cần bật JavaScript để dùng app.</p></noscript>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
