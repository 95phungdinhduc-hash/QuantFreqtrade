<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lil_Duck Quant · Freqtrade</title>
  <meta name="description" content="Dashboard giao dịch crypto bằng thống kê: Z-Score, EMA, kiểm định ADF, tư vấn chiến lược, screener, máy tính vốn. Dữ liệu Binance trực tiếp.">
  <meta name="theme-color" content="#05070d">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duck Quant">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- theme.css = bản chép NGUYÊN của dashboard/theme.css (tools/export_web_data.py tự đồng bộ) -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stApp" id="root">
  <button class="side-open" id="sideOpen" type="button" aria-label="Mở thanh bên" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 6 6 6-6 6"/><path d="m13 6 6 6-6 6"/></svg>
  </button>
  <div class="side-scrim" id="sideScrim"></div>

  <section data-testid="stSidebar" id="sidebar" aria-label="Thanh bên">
    <button class="side-close" id="sideClose" type="button" aria-label="Đóng thanh bên">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 6-6 6 6 6"/><path d="m11 6-6 6 6 6"/></svg>
    </button>
    <div data-testid="stSidebarUserContent" id="side"></div>
  </section>

  <main data-testid="stMain">
    <div class="block-container">
      <div class="stTabs">
        <div role="tablist" id="tablist" aria-label="Các trang">
          <button role="tab" type="button" data-tab="home" data-selected="true" aria-selected="true"><p>🏠 Tổng quan</p></button>
          <button role="tab" type="button" data-tab="advisor"><p>🧭 Tư vấn</p></button>
          <button role="tab" type="button" data-tab="analysis"><p>📈 Phân tích</p></button>
          <button role="tab" type="button" data-tab="screener"><p>🎯 Screener</p></button>
          <button role="tab" type="button" data-tab="risk"><p>🛡️ Vốn &amp; Rủi ro</p></button>
          <button role="tab" type="button" data-tab="news"><p>📰 Tin tức</p></button>
          <button role="tab" type="button" data-tab="bot"><p>🤖 Bot Freqtrade</p></button>
          <button role="tab" type="button" data-tab="backtest"><p>📊 Backtest</p></button>
        </div>
        <div data-testid="stTabPanel" role="tabpanel" id="p-home"></div>
        <div data-testid="stTabPanel" role="tabpanel" id="p-advisor" hidden></div>
        <div data-testid="stTabPanel" role="tabpanel" id="p-analysis" hidden></div>
        <div data-testid="stTabPanel" role="tabpanel" id="p-screener" hidden></div>
        <div data-testid="stTabPanel" role="tabpanel" id="p-risk" hidden></div>
        <div data-testid="stTabPanel" role="tabpanel" id="p-news" hidden></div>
        <div data-testid="stTabPanel" role="tabpanel" id="p-bot" hidden></div>
        <div data-testid="stTabPanel" role="tabpanel" id="p-backtest" hidden></div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<noscript><p style="padding:100px 20px;text-align:center;color:#eef1f8">Cần bật JavaScript để dùng app.</p></noscript>
<!-- fx.js = bản chép NGUYÊN của dashboard/fx.js (hiệu ứng: hiện dần, đếm số, nháy giá, mạng hạt) -->
<script src="js/fx.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
